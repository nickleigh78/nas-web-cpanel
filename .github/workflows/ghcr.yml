name: Build & push panel image to GHCR

# Builds the custom App Panel (app/) and publishes it to GitHub Container Registry
# so the NAS can PULL the image instead of building from source. Runs on GitHub's
# runners, not any live box.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ghcr.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/nickleigh78/nas-web-cpanel:latest
            ghcr.io/nickleigh78/nas-web-cpanel:${{ github.sha }}
