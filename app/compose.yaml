# Spike-Chilli App Panel (custom MVP). Deploy under /volume1/docker/app-panel/.
# Read-mostly: mounts the docker socket to list/act on containers. LAN-only.
services:
  panel:
    # Pull the CI-published image (built by .github/workflows/ghcr.yml on push to main):
    image: ghcr.io/nickleigh78/nas-web-cpanel:latest
    # Or build locally instead: comment the image line above and uncomment: build: .
    # build: .
    container_name: app-panel
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "8099:8099"
    environment:
      # Set PANEL_PASS to enable HTTP basic auth (leave unset only on a trusted LAN).
      PANEL_USER: "${PANEL_USER:-admin}"
      PANEL_PASS: "${PANEL_PASS:-}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
