# Portainer CE — the app-panel engine, on the DS1522+ (Container Manager).
# Deploy under /volume1/docker/portainer/. Bring-up is Nick's action (see README).
services:
  portainer:
    image: portainer/portainer-ce:2.45.3   # LTS (2.21.5 -> 2.39.6 2026-08-16 -> 2.45.1 2026-09-21 -> 2.45.3 2026-11-11); check docs.portainer.io/release-notes before bumping further
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "9443:9443"   # HTTPS UI  → https://<nas-ip>:9443
      - "8000:8000"   # Edge agent tunnel (optional; can be omitted)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # read-write: Portainer must create/manage containers
      - ./data:/data
      # Portainer runs `compose` inside THIS container, and the compose client reads `env_file:` itself,
      # so a stack's env_file must exist at the same path in here (proved by the T20 Phase 0 test, 2026-11-11:
      # "env file ... not found"). Read-only; add one line per stack that needs an external env_file.
      - /volume1/docker/invoiceninja:/volume1/docker/invoiceninja:ro
    # To load Nick's curated catalog on first start, uncomment and set the URL
    # (see catalog/README.md — needs a reachable URL: public raw or NAS-hosted):
    # command: --templates https://raw.githubusercontent.com/nickleigh78/nas-web-cpanel/main/catalog/templates.json
