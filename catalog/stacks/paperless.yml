# Curated catalog: Paperless-ngx (web + postgres + redis). One-click via Portainer.
services:
  broker:
    image: redis:7
    restart: unless-stopped
    volumes: [redis:/data]
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD:-change-me}
    volumes: [pgdata:/var/lib/postgresql/data]
  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on: [db, broker]
    ports: ["${PAPERLESS_PORT:-8010}:8000"]
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD:-change-me}
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - consume:/usr/src/paperless/consume
volumes:
  redis: {}
  pgdata: {}
  data: {}
  media: {}
  consume: {}
