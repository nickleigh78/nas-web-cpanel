# Curated catalog: Piwigo + MariaDB — the 5th Spike-Chilli Mirror app.
# RESTORE shape, VERIFIED WORKING 2026-07-27 (aligned to ../../../piwigo-local).
# The official piwigo/piwigo image (s6-overlay) is opinionated:
#   - whole web root mounts at /var/www/html/piwigo/ (NOT /gallery)
#   - a scripts dir must exist at /usr/local/bin/scripts/ or init aborts
#   - TZ is required; PIWIGO_UID/GID = the image's nginx user (100/101) so php-fpm
#     can read+write the tree (Synology's ACL fallback needs correct ownership)
#   - it detects an existing install (version-matched) and never rewrites
#     local/config/database.inc.php — bring-your-own-DB via the db service below.
# Not a blank-install template — restore per ../../../piwigo-local/R3-RESTORE-RUNBOOK.md.
services:
  db:
    image: mariadb:${MARIADB_IMAGE_TAG:-11.4}
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${PW_DB_NAME:-piwigo}   # real name set in the NAS .env (matches the dump)
      MARIADB_USER: ${PW_DB_USER:-piwigo}
      MARIADB_PASSWORD: ${PW_DB_PASSWORD:?set a strong local value}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - ${PW_ROOT:-/volume1/docker/piwigo}/db:/var/lib/mysql
    networks:
      - internal
  piwigo:
    # MUST equal the captured source version so the image leaves the install + schema untouched.
    image: piwigo/piwigo:${PW_IMAGE_TAG:-16.4.0}
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Australia/Brisbane}
      - PIWIGO_UID=${PIWIGO_UID:-100}
      - PIWIGO_GID=${PIWIGO_GID:-101}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PW_BIND_IP:?set the NAS LAN IP}:${PW_HTTP_PORT:-8085}:80"   # LAN-only, never 0.0.0.0
    volumes:
      - ${PW_ROOT:-/volume1/docker/piwigo}/gallery:/var/www/html/piwigo/
      - ${PW_ROOT:-/volume1/docker/piwigo}/scripts:/usr/local/bin/scripts/
    networks:
      - internal
networks:
  internal:
    driver: bridge
