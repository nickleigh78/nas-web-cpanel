# Curated catalog: Piwigo + MariaDB — the 5th Spike-Chilli Mirror app.
# RESTORE shape (aligned to ../../../piwigo-local): bind-mounts so the 17 GB R1
# capture seeds straight in, image VERSION-PINNED (not :latest) so the code
# matches the restored DB schema, port LAN-bound. This is NOT a blank-install
# template — deploy then restore per ../../../piwigo-local/R3-RESTORE-RUNBOOK.md.
services:
  db:
    image: mariadb:${MARIADB_IMAGE_TAG:-11.4}
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${PW_DB_NAME:-ciqndvoj_piwi514}   # matches the dump
      MARIADB_USER: ${PW_DB_USER:-piwigo}
      MARIADB_PASSWORD: ${PW_DB_PASSWORD:?set a strong local value}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"                 # import as the app user, no root secret
    volumes:
      - ${PW_ROOT:-/volume1/docker/piwigo}/db:/var/lib/mysql
    networks:
      - internal
  piwigo:
    # MUST be >= source Piwigo 16.4.0 so code matches the restored schema. Confirm the tag exists.
    image: piwigo/piwigo:${PW_IMAGE_TAG:-16.4.0}
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${PW_BIND_IP:?set the NAS LAN IP}:${PW_HTTP_PORT:-8085}:80"   # LAN-only, never 0.0.0.0
    volumes:
      # /gallery = the full Piwigo web root; the captured public_html/photography seeds here.
      - ${PW_ROOT:-/volume1/docker/piwigo}/gallery:/gallery
    networks:
      - internal
networks:
  internal:
    driver: bridge
